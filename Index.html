
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حناشة دردشة - Hannacha Chat</title>
    <!-- استيراد خط عربي جميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #2e1065, #4c1d95, #6d28d9);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 850px;
            background: #1e1b4b;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid #7c3aed;
        }

        /* رأس الواجهة */
        .header {
            text-align: center;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            color: #a78bfa;
            text-shadow: 0 2px 10px rgba(167, 139, 250, 0.4);
            margin-bottom: 5px;
        }

        .header h2 {
            font-size: 16px;
            color: #c4b5fd;
            font-weight: 600;
            opacity: 0.9;
        }

        /* وسط الواجهة - زر تسجيل الدخول بقوقل */
        .content-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
        }

        .welcome-text {
            font-size: 14px;
            color: #ddd6fe;
            text-align: center;
            margin-bottom: 10px;
        }

        .google-btn {
            background: #ffffff;
            color: #1e1b4b;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            width: 85%;
            justify-content: center;
        }

        .google-btn:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .google-icon {
            width: 22px;
            height: 22px;
        }

        /* الأيقونات الأربع في الأسفل */
        .footer-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            padding: 8px 0;
            border-radius: 15px;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            background: rgba(124, 58, 237, 0.4);
        }

        .nav-icon {
            font-size: 22px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- رأس الواجهة -->
        <div class="header">
            <h1>حناشة دردشة</h1>
            <h2>دردش اتصال مسنجر و فيديو</h2>
        </div>

        <!-- محتوى الشاشة وسط التطبيق -->
        <div class="content-body">
            <p class="welcome-text">أهلاً بك! تواصل مع أصدقائك بسهولة وبدون تعقيد.</p>
            
            <!-- زر تسجيل الدخول بواسطة جوجل فقط -->
            <button class="google-btn" onclick="loginWithGoogle()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.18v3.15C3.17 21.36 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.18C.43 8.08 0 9.99 0 12s.43 3.92 1.18 5.42l4.1-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.18 6.58l4.1 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                تسجيل الدخول بقوقل
            </button>
        </div>

        <!-- الأيقونات الأربع في الأسفل -->
        <div class="footer-nav">
            <button class="nav-item" onclick="switchTab(this, 'مكالمة فيديو')">
                <span class="nav-icon">📹</span>
                <span class="nav-label">مكالمة فيديو</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'مكالمة عادية')">
                <span class="nav-icon">📞</span>
                <span class="nav-label">مكالمة عادية</span>
            </button>
            <button class="nav-item" onclick="switchTab(this, 'رسائل')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">رسائل</span>
            </button>
            <button class="nav-item active" onclick="switchTab(this, 'تسجيل الدخول')">
                <span class="nav-icon">🔐</span>
                <span class="nav-label">تسجيل الدخول</span>
            </button>
        </div>

    </div>

    <script>
        function loginWithGoogle() {
            alert("تم النقر على تسجيل الدخول باستخدام حساب جوجل (سيتم ربطه بنظام المصادقة قريباً).");
        }

        function switchTab(element, tabName) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            if (tabName !== 'تسجيل الدخول') {
                console.log("الانتقال إلى تبويب: " + tabName);
            }
        }
    </script>
</body>
</html>
